services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omniobserve}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in bootstrap.env}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-omniobserve}
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set
        POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-omniobserve}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://opencode.ai/zen/go/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen3.6-plus}
      OLLAMA_BASE_URL: http://embedding-cpu:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      LLM_MOCK: ${LLM_MOCK:-0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-0}
    expose:
    - '8000'
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
    - default
    - embeddings
    build:
      context: ../backend
  frontend:
    restart: unless-stopped
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:?Set VITE_WS_BASE_URL}
        VITE_AUDIO_WS_BASE_URL: ${VITE_AUDIO_WS_BASE_URL:?Set VITE_AUDIO_WS_BASE_URL}
        VITE_JITSI_BASE_URL: ${VITE_JITSI_BASE_URL:?Set VITE_JITSI_BASE_URL}
volumes:
  postgres_data:
    external: true
    name: ${OMNI_POSTGRES_VOLUME:?Set OMNI_POSTGRES_VOLUME}
networks:
  embeddings:
    external: true
    name: omniobserve-embeddings
