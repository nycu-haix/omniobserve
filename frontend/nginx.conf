server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # OmniObserve is a research tool, not a public site: keep every
    # response out of search indexes while still letting crawlers read it.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # No sitemap is published; avoid serving the app shell as one.
    location = /sitemap.xml {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}